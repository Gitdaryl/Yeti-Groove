<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Yeti Groove Media · Save our contact</title>
  <meta name="description" content="Save Yeti Groove Media to your contacts: commissioned cinematic films, photoreal pre-visualization and community platforms from Devils Lake, Michigan." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#080807" />
  <link rel="canonical" href="https://www.yetigroove.com/card" />
  <meta property="og:title" content="Yeti Groove Media" />
  <meta property="og:description" content="Big-screen work. Lake-town roots. Commissioned films, pre-visualization, and community platforms from Devils Lake, Michigan." />
  <meta property="og:image" content="https://www.yetigroove.com/og-studio.jpg" />
  <link rel="icon" href="/brand/yeti-head-256.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #080807; --dark: #0F0E0C; --gold: #C9A55A; --cream: #F0EDE6; --muted: #B0A390; --line: rgba(201,165,90,0.22);
      --serif: 'Playfair Display', Georgia, serif; --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--black); color: var(--cream); font: 400 1.0625rem/1.3 var(--sans);
      min-height: 100dvh; padding: max(32px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    main { max-width: 440px; margin: 0 auto; display: grid; gap: 24px; text-align: center; }
    .head { width: 112px; height: auto; margin: 0 auto; display: block; }
    .eyebrow { color: var(--gold); font-size: 0.8125rem; letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { font: 700 2.125rem/1.2 var(--serif); margin-top: 8px; }
    .lede { color: var(--muted); }
    .actions { display: grid; gap: 12px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 20px;
      border-radius: 14px; font: 500 1.0625rem/1 var(--sans); text-decoration: none; transition: filter .15s;
    }
    .btn:active { filter: brightness(.85); }
    .btn.primary { background: var(--gold); color: var(--black); }
    .btn.ghost { border: 1px solid var(--line); color: var(--cream); min-height: 48px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn svg { width: 20px; height: 20px; flex: none; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .reel { display: grid; gap: 12px; text-align: left; }
    .label { color: var(--gold); font-size: 0.8125rem; letter-spacing: 0.18em; text-transform: uppercase; }
    video { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: var(--dark); display: block; }
    .foot { padding-top: 8px; border-top: 1px solid var(--line); }
    .foot a { display: inline-flex; align-items: center; min-height: 44px; color: var(--muted); font-size: 0.9375rem; text-underline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  </style>
</head>
<body>
<main>
  <header>
    <img class="head" src="/brand/yeti-head-256.png" width="112" height="103" alt="" />
    <p class="eyebrow" style="margin-top:16px">Devils Lake · Michigan</p>
    <h1>Yeti Groove Media</h1>
  </header>
  <p class="lede">We make commissioned cinematic films, photoreal pre-visualization and the community platforms that run the Irish Hills lake country.</p>

  <div class="actions">
    <a class="btn primary" href="/yeti.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      Save contact
    </a>
    <div class="pair">
      <a class="btn ghost" href="mailto:daryl@yetigroove.com">Email</a>
      <a class="btn ghost" href="/">Website</a>
    </div>
  </div>

  <section class="reel" aria-labelledby="reel-label">
    <p class="label" id="reel-label">The reel</p>
    <video controls preload="none" playsinline
           poster="https://cxjvtxyoegr2mjey.public.blob.vercel-storage.com/reel/yetis-in-the-groove-poster-boat.jpg"
           src="https://cxjvtxyoegr2mjey.public.blob.vercel-storage.com/reel/yetis-in-the-groove.mp4"></video>
  </section>

  <p class="foot"><a href="/review">Worked with us? Tell Google how we did</a></p>
</main>
</body>
</html>
